# 英语之道站点内容（阿里云武汉 Aliyun-wuhan，/etc/nginx/snippets/yingyu-site.conf）。80 口和 443 口共用这一份。
# 规则照新加坡那台的容器 nginx + 边缘 Caddy 抄过来（见 D:\vps\TXcloud-sg-2H2G\SERVER.md）。
# 2026-11-08 用户要求去掉身份验证，这里也不加；真题有版权，只给自己人用，不让搜索引擎收录。

# /srv/yingyu/current 是指向 releases/<时间戳> 的相对软链接，换发布不用重载 nginx
root /srv/yingyu/current;
index index.html;
sendfile on;
tcp_nopush on;
server_tokens off;
charset utf-8;

# Debian 的 nginx.conf 只开了 gzip、没设类型。PDF、mp3 不压（压不小，还会让分段请求失效）
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

# 每个带 add_header 的 location 都要再 include 一次：nginx 里 location 一写 add_header，server 级的就全不继承了
include snippets/yingyu-headers.conf;

# Service Worker 和入口页每次都回源校验，不然新版发了用户还在老版
location = /sw.js { add_header Cache-Control "no-cache"; include snippets/yingyu-headers.conf; }
location = /index.html { add_header Cache-Control "no-cache"; include snippets/yingyu-headers.conf; }
location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; include snippets/yingyu-headers.conf; }
# 带指纹的构建产物长缓存
location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; include snippets/yingyu-headers.conf; }
# nginx 自带的 mime.types 不认 .mjs，会当 octet-stream 发；加了 nosniff 浏览器就拒绝加载 pdf.js 的 worker，试卷打不开
location ~* \.mjs$ { types { } default_type text/javascript; add_header Cache-Control "public, max-age=31536000, immutable"; include snippets/yingyu-headers.conf; }
# 听力 mp3 很少变；试卷 JSON、PDF 重导后会变，缓存一小时
location /audio/ { add_header Cache-Control "public, max-age=604800"; include snippets/yingyu-headers.conf; }
location /papers/ { add_header Cache-Control "public, max-age=3600"; include snippets/yingyu-headers.conf; }
location /ielts/ { add_header Cache-Control "public, max-age=3600"; include snippets/yingyu-headers.conf; }
location /dict/ { add_header Cache-Control "public, max-age=86400"; include snippets/yingyu-headers.conf; }
location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
# 查词在线兜底（2026-11-12 用户同意）：离线词典查不到的词和短语，页面请求 /yd/?q=…，这里转发到有道词典的 jsonapi。
# 浏览器不能直接跨域请求有道。只转发查询串；不带 Cookie、Referer 和用户 IP，去掉有道的 Set-Cookie。见 src/lib/youdao.ts
location /yd/ {
    proxy_pass https://dict.youdao.com/jsonapi;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host dict.youdao.com;
    proxy_set_header User-Agent "Mozilla/5.0";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    add_header Cache-Control "public, max-age=604800";
    include snippets/yingyu-headers.conf;
}
# 前端路由（/paper/<id> 等）回到入口页
# AI 助教（server/agent_server.py，systemd 服务 yingyu-agent，只听 127.0.0.1:8787）：提问、整理记忆、管理后台
location /api/agent/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # 回答一段一段流回来
    proxy_read_timeout 120s;
    client_max_body_size 256k;
    include snippets/yingyu-headers.conf;
}
location /api/admin/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
    include snippets/yingyu-headers.conf;
}
# 账号和跨设备同步（同一个后端）
location ~ ^/api/(auth/|sync$|handoff) {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 8m;
    include snippets/yingyu-headers.conf;
}
location ~ ^/admin/?$ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header X-Real-IP $remote_addr;
    include snippets/yingyu-headers.conf;
}

location / { try_files $uri /index.html; }
