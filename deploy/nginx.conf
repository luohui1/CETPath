# 英语之道静态站（容器 yingyu-web，nginx:alpine）。HTTPS、basic auth、压缩都在边缘 Caddy 做，这里只管发文件。
server {
    listen 80;
    server_name _;
    # /srv/yingyu 只读挂进来，current 是指向 releases/<时间戳> 的相对软链接，换发布不用重启容器
    root /srv/yingyu/current;
    index index.html;
    sendfile on;
    tcp_nopush on;
    # Service Worker 和入口页每次都回源校验，不然新版发了用户还在老版
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    # 带指纹的构建产物长缓存
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    # nginx 自带的 mime.types 不认 .mjs，会当 octet-stream 发出去；边缘加了 nosniff，浏览器就拒绝加载 pdf.js 的 worker，试卷打不开
    location ~* \.mjs$ { types { } default_type text/javascript; add_header Cache-Control "public, max-age=31536000, immutable"; }
    # 听力 mp3 很少变；试卷 JSON、PDF 重导后会变，缓存一小时
    location /audio/ { add_header Cache-Control "public, max-age=604800"; }
    location /papers/ { add_header Cache-Control "public, max-age=3600"; }
    location /dict/ { add_header Cache-Control "public, max-age=86400"; }
    # 前端路由（/paper/<id> 等）回到入口页
    location / { try_files $uri $uri/ /index.html; }
}
